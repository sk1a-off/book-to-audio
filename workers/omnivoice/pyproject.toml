[project]
name = "audiobook-omnivoice-worker"
version = "0.1.0"
description = "Internal OmniVoice inference worker for the audiobook API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.0",
    "huggingface-hub==1.25.1",
    "numpy==2.4.6",
    "num2words==0.5.14",
    "omnivoice==0.2.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3",
    "pytest==9.1.1",
    "ruff>=0.14,<0.16",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
