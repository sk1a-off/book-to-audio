[project]
name = "audiobook-stt-worker"
version = "0.1.0"
description = "Internal Faster Whisper inference worker for the audiobook API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==18.0.0",
    "ctranslate2==4.7.1",
    "fastapi==0.140.0",
    "faster-whisper==1.2.1",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3",
    "pytest==9.1.1",
    "ruff>=0.14,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
