[project]
name = "audiobook-rewriter-worker"
version = "0.1.0"
description = "Stateless CPU-only Qwen GGUF rewrite worker for the audiobook API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.0",
    "huggingface-hub==1.25.1",
    "llama-cpp-python==0.3.34",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3",
    "pytest==9.1.1",
    "ruff>=0.14,<0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rewriter_worker/config.py" = ["RUF001"]
"src/rewriter_worker/prompt.py" = ["RUF001"]
"tests/*.py" = ["RUF001"]
